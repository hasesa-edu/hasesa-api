[project]
name = "hasesa-api"
version = "0.1.0"
description = "Hasesa backend API: accounts, content, learning, billing and AI for every Hasesa app."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30",
  "alembic>=1.14,<2",
  "pyjwt[crypto]>=2.10",
  "httpx>=0.28",
  "ruamel-yaml>=0.18",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.28",
  "anyio>=4.6",
  "ruff>=0.8",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "hasesa_api.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
# Agent skills copied from installed libraries (library-skills); not our code.
extend-exclude = [".agents", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
